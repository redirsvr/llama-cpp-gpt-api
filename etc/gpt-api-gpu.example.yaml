Name: gpt-api
Host: 0.0.0.0
Port: 8080
Timeout: 180000
Log:
  Mode: file
  Level: error
  KeepDays: 7

ModelsDir: models
DefaultModel: "Qwen3.6-35B-A3B-Q4_K_M"

EmbeddingModels:
  - "nomic-embed-text-v1.5"
DefaultEmbeddingModel: "nomic-embed-text-v1.5"

# Отдельные опции для embedding (иначе берутся ModelOption с безопасными лимитами)
EmbeddingModelOption:
  ContextSize: 2048
  NGPULayers: -1
  MainGPU: "0"
  NBatch: 2048
  F16Memory: true
  MMap: true

ModelOption:
  # --- 2 GPU: ручной split (укажите число слоёв под вашу VRAM) ---
  NGPULayers: 80
  MainGPU: "0"
  TensorSplit: "1,1"
  # --- 1 GPU или авто-fit без TensorSplit ---
  # NGPULayers: -1
  # MainGPU: "0"
  ContextSize: 8192
  NBatch: 512
  F16Memory: true
  MMap: true

UserName: assistant
SystemPrompt: You are a helpful AI assistant.

# Hybrid RAG (PostgreSQL + pgvector). См. deploy/rag-postgres/docker-compose.yaml
RAG:
  Enabled: true
  # true — подмешивать базу знаний в обычный POST /v1/chat/completions (без use_rag в JSON)
  UseInChatCompletions: true
  # UIDisabled: true  # отключить веб-UI
  # UI: http://<host>:<port>/ui/
  Postgres:
    Host: 127.0.0.1
    Port: 5432
    Database: gpt_rag
    User: gpt
    Password: gpt
    SSLMode: disable
  EmbeddingModel: "nomic-embed-text-v1.5"
  EmbeddingDimensions: 768
  # для nomic подставляются автоматически; после смены — переиндексация документов
  # EmbedQueryPrefix: "search_query: "
  # EmbedDocumentPrefix: "search_document: "
  EmbeddingContextSize: 2048
  StagingDir: data/rag-staging
  RemoveStagingAfterIngest: false
  SemanticIngestMaxBytes: 524288
  # PDF: builtin — встроенный парсер; auto — builtin, затем pdftotext; pdftotext — только утилита
  PDFExtract: builtin
  Chunking:
    MaxChunkChars: 1500
    MaxEmbedRunes: 512
    MinChunkChars: 80
    BreakpointPercentile: 0.25
    MaxSentencesSemantic: 64
  IngestTimeoutSec: 900
  Hybrid:
    TopK: 8
    VectorWeight: 0.6
    TextWeight: 0.4
  AutoIngest:
    Enabled: true
    Directories:
      - /root/rag-docs
    Extensions: [".txt", ".md", ".markdown", ".pdf"]
    ScanOnStart: true
    IntervalSec: 300

# Prometheus: GET http://<host>:<port>/metrics
# Grafana: grafana/dashboards/gpt-api.json (uid: gpt-api-llama)
#   docker compose -f grafana/docker-compose.yaml up -d  → http://localhost:3000 (admin/admin)
